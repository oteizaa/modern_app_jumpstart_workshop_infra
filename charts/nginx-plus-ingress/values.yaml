---
nginx-ingress:
  controller:
    logLevel: "info"

# InitContainer para preparar las carpetas de App Protect en k3s sin descargar imágenes
    initContainers:
      - name: setup-nap-dirs
        image: private-registry.nginx.com/nginx-ic-nap/nginx-plus-ingress:5.5.4-agent
        imagePullPolicy: Never # <--- Fuerza a usar la imagen local de k3s
        command: ['sh', '-c', 'mkdir -p /opt/app_protect/bd_config/tables /opt/app_protect/var /opt/app_protect/bundles && chmod -R 777 /opt/app_protect']

    readinessProbe:
      custom: true
    readyStatus:
      enable: false



    appprotect:
      enable: true
      v5: true
      securityContext:
        readOnlyRootFilesystem: false
      enforcer:
        image:
          repository: private-registry.nginx.com/nap/waf-enforcer        
          tag: "5.6.0"
          pullPolicy: Never  # también son imágenes separadas -> mismo tratamiento air-gapped
      configManager:
        image:
          repository: private-registry.nginx.com/nap/waf-config-mgr
          tag: "5.6.0"
          pullPolicy: Never
          
    volumes:
      - name: app-protect-bd-config
        emptyDir: {}
      - name: app-protect-var
        emptyDir: {}
      - name: app-protect-bundles
        emptyDir: {}

    volumeMounts:
      - name: app-protect-bd-config
        mountPath: /opt/app_protect/bd_config
      - name: app-protect-var
        mountPath: /opt/app_protect/var
      - name: app-protect-bundles
        mountPath: /opt/app_protect/bundles


    appprotectdos:
      enable: false
  
      
    enableSnippets: true
    
    image:
      repository: private-registry.nginx.com/nginx-ic-nap/nginx-plus-ingress
      tag: 5.5.4-agent
      pullPolicy: Never # <--- Forzamos a k3s a usar la imagen local
    
    nginxplus: true

    extraArgs:
      - -app-protect-enforcer-address=127.0.0.1:50000
    
    mgmtConfigMap:
      enable: true
      name: "nginx-ingress/nginx-plus-ingress-nginx-ingress"
    
    nginxStatus:
      allowCidrs: 0.0.0.0/0
      port: 9000
    
    readyStatus:
      initialDelaySeconds: 30
    
    serviceAccount:
      imagePullSecretName: ghcr
    
    service:
      customPorts:
        - port: 9114
          targetPort: service-insight
          nodePort: 31000
          protocol: TCP
          name: service-insight
        - port: 9000
          targetPort: 9000
          nodePort: 32000
          protocol: TCP
          name: nginx-status
  
    nginxAgent:
      enable: true
      dataplaneKeySecretName: nginx-one-dataplane-key   # Secret requerido si enable=true
  
  prometheus:
    create: true
  serviceInsight:
    create: true

