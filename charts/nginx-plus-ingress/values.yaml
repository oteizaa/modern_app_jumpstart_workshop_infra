---
nginx-ingress:
  controller:
    logLevel: "info"
    
    appprotect:
      enable: true
      v5: true
      securityContext:
        readOnlyRootFilesystem: false
      enforcer:
        image:
          tag: "5.6.0"
          pullPolicy: Never  # también son imágenes separadas -> mismo tratamiento air-gapped
      configManager:
        image:
          tag: "5.6.0"
          pullPolicy: Never

    appprotectdos:
      enable: false
  
      
    enableSnippets: true
    
    image:
      repository: private-registry.nginx.com/nginx-ic-nap/nginx-plus-ingress
      tag: 5.5.4-agent
      pullPolicy: Never # <--- Forzamos a k3s a usar la imagen local
    
    nginxplus: true
    
    mgmtConfigMap:
      enable: true
      name: "nginx-ingress/nginx-plus-ingress-nginx-ingress"
    
    nginxStatus:
      allowCidrs: 0.0.0.0/0
      port: 9000
    
    readyStatus:
      initialDelaySeconds: 30
    
    serviceAccount:
      imagePullSecretName: ghcr
    
    service:
      customPorts:
        - port: 9114
          targetPort: service-insight
          nodePort: 31000
          protocol: TCP
          name: service-insight
        - port: 9000
          targetPort: 9000
          nodePort: 32000
          protocol: TCP
          name: nginx-status
  
  nginxAgent:
    enable: true
    dataplaneKeySecretName: nginx-one-dataplane-key   # Secret requerido si enable=true
  
  prometheus:
    create: true
  serviceInsight:
    create: true
